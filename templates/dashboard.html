      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.45);
    }

    /* Dark glass classes */
    .dark .glass {
      background: rgba(24, 21, 40, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .dark .glass-card {
      background: rgba(30, 27, 46, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Light glass classes */
    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 0, 0, 0.07);
      box-shadow: 0 2px 12px -1px rgba(0, 0, 0, 0.04);
    }

    .pulse-dot {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       Sky Toggle Theme Switch Styles (from sky-toggle.tsx)
       ═══════════════════════════════════════════════════════════════════════════ */
    .sky-toggle-wrapper .theme-switch {
      --toggle-size: 11.5px;
      /* Precision scaled for modern navbar */
      --container-width: 5.625em;
      --container-height: 2.5em;
      --container-radius: 6.25em;
      --container-light-bg: #3D7EAE;
      --container-night-bg: #1D1F2C;
      --circle-container-diameter: 3.375em;
      --sun-moon-diameter: 2.125em;
      --sun-bg: #ECCA2F;
      --moon-bg: #C4C9D1;
      --spot-color: #959DB1;
      --circle-container-offset: calc((var(--circle-container-diameter) - var(--container-height)) / 2 * -1);
      --stars-color: #fff;
      --clouds-color: #F3FDFF;
      --back-clouds-color: #AACADF;
      --transition: .5s cubic-bezier(0, -0.02, 0.4, 1.25);
      --circle-transition: .3s cubic-bezier(0, -0.02, 0.35, 1.17);
      display: inline-block;
      user-select: none;
    }

    .sky-toggle-wrapper .theme-switch,
    .sky-toggle-wrapper .theme-switch *,
    .sky-toggle-wrapper .theme-switch *::before,
    .sky-toggle-wrapper .theme-switch *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-size: var(--toggle-size);
    }

    .sky-toggle-wrapper .theme-switch__container {
      width: var(--container-width);
      height: var(--container-height);
      background-color: var(--container-light-bg);
      border-radius: var(--container-radius);
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0em -0.062em 0.062em rgba(0, 0, 0, 0.25), 0em 0.062em 0.125em rgba(255, 255, 255, 0.94);
      transition: var(--transition);
      position: relative;
    }

    .sky-toggle-wrapper .theme-switch__container::before {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      box-shadow: 0em 0.05em 0.187em rgba(0, 0, 0, 0.25) inset;
      border-radius: var(--container-radius);
    }

    .sky-toggle-wrapper .theme-switch__checkbox {
      display: none;
    }

    .sky-toggle-wrapper .theme-switch__circle-container {
      width: var(--circle-container-diameter);
      height: var(--circle-container-diameter);
      background-color: rgba(255, 255, 255, 0.1);
      position: absolute;
      left: var(--circle-container-offset);
      top: var(--circle-container-offset);
      border-radius: var(--container-radius);
      box-shadow: inset 0 0 0 3.375em rgba(255, 255, 255, 0.1), 0 0 0 0.625em rgba(255, 255, 255, 0.1), 0 0 0 1.25em rgba(255, 255, 255, 0.1);
      display: flex;
      transition: var(--circle-transition);
      pointer-events: none;
    }

    .sky-toggle-wrapper .theme-switch__sun-moon-container {
      pointer-events: auto;
      position: relative;
      z-index: 2;
      width: var(--sun-moon-diameter);
      height: var(--sun-moon-diameter);
      margin: auto;
      border-radius: var(--container-radius);
      background-color: var(--sun-bg);
      box-shadow: 0.062em 0.062em 0.062em 0em rgba(254, 255, 239, 0.61) inset, 0em -0.062em 0.062em 0em #a1872a inset;
      filter: drop-shadow(0.062em 0.125em 0.125em rgba(0, 0, 0, 0.25)) drop-shadow(0em 0.062em 0.125em rgba(0, 0, 0, 0.25));
      overflow: hidden;
      transition: var(--transition);
    }

    .sky-toggle-wrapper .theme-switch__moon {
      transform: translateX(100%);
      width: 100%;
      height: 100%;
      background-color: var(--moon-bg);
      border-radius: inherit;
      box-shadow: 0.062em 0.062em 0.062em 0em rgba(254, 255, 239, 0.61) inset, 0em -0.062em 0.062em 0em #969696 inset;
      transition: var(--transition);
      position: relative;
    }

    .sky-toggle-wrapper .theme-switch__spot {
      position: absolute;
      top: 0.75em;
      left: 0.312em;
      width: 0.75em;
      height: 0.75em;
      border-radius: var(--container-radius);
      background-color: var(--spot-color);
      box-shadow: 0em 0.0312em 0.062em rgba(0, 0, 0, 0.25) inset;
    }

    .sky-toggle-wrapper .theme-switch__spot:nth-of-type(2) {
      width: 0.375em;
      height: 0.375em;
      top: 0.937em;
      left: 1.375em;
    }

    .sky-toggle-wrapper .theme-switch__spot:nth-last-of-type(3) {
      width: 0.25em;
      height: 0.25em;
      top: 0.312em;
      left: 0.812em;
    }

    .sky-toggle-wrapper .theme-switch__clouds {
      width: 1.25em;
      height: 1.25em;
      background-color: var(--clouds-color);
      border-radius: var(--container-radius);
      position: absolute;
      bottom: -0.625em;
      left: 0.312em;
      box-shadow: 0.937em 0.312em var(--clouds-color), -0.312em -0.312em var(--back-clouds-color), 1.437em 0.375em var(--clouds-color), 0.5em -0.125em var(--back-clouds-color), 2.187em 0 var(--clouds-color), 1.25em -0.062em var(--back-clouds-color), 2.937em 0.312em var(--clouds-color), 2em -0.312em var(--back-clouds-color), 3.625em -0.062em var(--clouds-color), 2.625em 0em var(--back-clouds-color), 4.5em -0.312em var(--clouds-color), 3.375em -0.437em var(--back-clouds-color), 4.625em -1.75em 0 0.437em var(--clouds-color), 4em -0.625em var(--back-clouds-color), 4.125em -2.125em 0 0.437em var(--back-clouds-color);
      transition: 0.5s cubic-bezier(0, -0.02, 0.4, 1.25);
    }

    .sky-toggle-wrapper .theme-switch__stars-container {
      position: absolute;
      color: var(--stars-color);
      top: -100%;
      left: 0.312em;
      width: 2.75em;
      height: auto;
      transition: var(--transition);
    }

    /* Actions for Sky Toggle Switch */
    .sky-toggle-wrapper .theme-switch__checkbox:checked+.theme-switch__container {
      background-color: var(--container-night-bg);
    }

    .sky-toggle-wrapper .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__circle-container {
      left: calc(100% - var(--circle-container-offset) - var(--circle-container-diameter));
    }

    .sky-toggle-wrapper .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__circle-container:hover {
      left: calc(100% - var(--circle-container-offset) - var(--circle-container-diameter) - 0.187em);
    }

    .sky-toggle-wrapper .theme-switch__circle-container:hover {
      left: calc(var(--circle-container-offset) + 0.187em);
    }

    .sky-toggle-wrapper .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__moon {
      transform: translate(0);
    }

    .sky-toggle-wrapper .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__clouds {
      bottom: -4.062em;
    }

    .sky-toggle-wrapper .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__stars-container {
      top: 50%;
      transform: translateY(-50%);
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       Modern Hero Section Styles & Animations
       ═══════════════════════════════════════════════════════════════════════════ */
    @keyframes floo-orb-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes floo-underline-draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes floo-button-sweep {

      0%,
      60% {
        left: -60%;
      }

      100% {
        left: 130%;
      }
    }

    @keyframes floo-caret-blink {
      50% {
        opacity: 0;
      }
    }

    @keyframes floo-rise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-floo-orb-spin {
      animation: floo-orb-spin 22s linear infinite;
    }

    .animate-floo-underline-draw {
      animation: floo-underline-draw 1.2s 0.2s cubic-bezier(.25, .46, .45, .94) forwards;
    }

    .animate-floo-button-sweep {
      animation: floo-button-sweep 2.5s 1.2s ease-in-out infinite;
    }

    .animate-floo-caret-blink {
      animation: floo-caret-blink 1.1s step-end infinite;
    }

    .animate-floo-rise {
      animation: floo-rise 0.7s ease both;
    }
  </style>
</head>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback, forwardRef, useImperativeHandle } = React;

    // ── Splashed Push Notifications Component ─────────────────────────
    const NOTIFICATION_ICONS = {

    const SplashedPushNotifications = forwardRef(({ timerColor, timerBgColor }, ref) => {

    const GANTT_DAY = 86400000;
    const GANTT_UNIT = { day: 32, week: 10, month: 3 };
    const GANTT_HEADER = 32;

    const ganttStartOfDay = (date) => new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const ganttAddDays = (date, days) => new Date(date.getFullYear(), date.getMonth(), date.getDate() + days);
    const ganttDaysBetween = (a, b) => Math.round((ganttStartOfDay(b).getTime() - ganttStartOfDay(a).getTime()) / GANTT_DAY);
    const ganttShort = (date) => date.toLocaleDateString(undefined, { month: "short", day: "numeric" });

    function GanttChartComponent({ tasks = [], label, defaultZoom = "week", today: todayProp, rowHeight = 36 }) {
      const [width, setWidth] = useState(640);
      const [scrollLeft, setScrollLeft] = useState(0);
      const [zoom, setZoom] = useState(defaultZoom);
      const [active, setActive] = useState(null);
      const scrollRef = useRef(null);

      useEffect(() => {
        if (!scrollRef.current) return;
        const updateWidth = () => {
          if (scrollRef.current) {
            setWidth(scrollRef.current.clientWidth || 640);
          }
        };
        updateWidth();
        window.addEventListener('resize', updateWidth);
        return () => window.removeEventListener('resize', updateWidth);
      }, []);

      const safeTasks = Array.isArray(tasks) ? tasks : [];
      const today = ganttStartOfDay(todayProp || new Date());
      const rows = [];
      const lanes = [...new Set(safeTasks.map((task) => task.lane || ""))];
      const ordered = [];
      for (const lane of lanes) {
        if (lane) rows.push({ kind: "lane", lane });
        for (const task of safeTasks.filter((entry) => (entry.lane || "") === lane)) {
          rows.push({ kind: "task", task, order: ordered.length });
          ordered.push(task);
        }
      }

      let first = today;
      let last = today;
      for (const task of safeTasks) {
        if (task.start && task.start < first) first = task.start;
        const end = task.milestone ? task.start : task.end;
        if (end && end > last) last = end;
      }
      let origin = ganttAddDays(first, zoom === "day" ? -1 : -2);
      if (zoom === "week") origin = ganttAddDays(origin, -((origin.getDay() + 6) % 7));
      if (zoom === "month") origin = new Date(origin.getFullYear(), origin.getMonth(), 1);

      const unit = GANTT_UNIT[zoom] || 10;
      const span = ganttDaysBetween(origin, last) + (zoom === "month" ? 21 : 6);
      const chartWidth = Math.max(width, span * unit);
      const height = GANTT_HEADER + rows.length * rowHeight + 8;
      const toX = (date) => ganttDaysBetween(origin, date) * unit;
      const rowY = new Map();
      rows.forEach((row, index) => {
        if (row.kind === "task") {
          rowY.set(row.task.id, GANTT_HEADER + index * rowHeight + rowHeight / 2);
        }
      });

      const ticks = [];
      for (let offset = 0; offset * unit <= chartWidth; offset += 1) {
        const date = ganttAddDays(origin, offset);
        if (zoom === "day") {
          ticks.push({ date, text: String(date.getDate()), major: date.getDate() === 1 || offset === 0 });
        } else if (zoom === "week" && date.getDay() === 1) {
          ticks.push({ date, text: ganttShort(date), major: false });
        } else if (zoom === "month" && date.getDate() === 1) {
          ticks.push({ date, text: date.toLocaleDateString(undefined, { month: "short", year: "2-digit" }), major: false });
        }
      }

      const current = active === null ? null : ordered[active];

      return (
        <div className="flex w-full flex-col gap-3">
          <div className="flex items-center justify-between">
            <div className="text-xs font-semibold text-slate-700 dark:text-gray-300 flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-orange-500" />
              <span>{label || 'Automation Timeline & Milestones'}</span>
            </div>
            <div className="inline-flex rounded-xl bg-black/[0.04] dark:bg-white/5 p-1 border border-black/5 dark:border-white/10 text-xs">
              {['day', 'week', 'month'].map((z) => (
                <button
                  key={z}
                  type="button"
                  onClick={() => setZoom(z)}
                  className={`px-3 py-1 rounded-lg font-semibold capitalize transition ${zoom === z
                    ? 'bg-gradient-to-r from-orange-500 to-amber-500 text-white shadow-sm'
                    : 'text-slate-500 dark:text-gray-400 hover:text-slate-900 dark:hover:text-white'
                    }`}
                >
                  {z}
                </button>
              ))}
            </div>
          </div>

          <div className="relative w-full overflow-hidden rounded-2xl border border-black/[0.08] dark:border-white/10 bg-white/40 dark:bg-black/40 backdrop-blur-md shadow-sm">
            <div className="flex w-full">
              {/* Task list left sidebar */}
              <div className="w-[36%] max-w-[240px] shrink-0 border-r border-black/[0.08] dark:border-white/10 bg-black/[0.01] dark:bg-white/[0.02]">
                <div style={{ height: GANTT_HEADER }} className="border-b border-black/[0.08] dark:border-white/10 flex items-center px-3.5 text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-gray-500">
                  Automation Tasks
                </div>
                {rows.map((row) => (
                  <div
                    key={row.kind === "lane" ? `lane-${row.lane}` : row.task.id}
                    style={{ height: rowHeight }}
                    className={`flex items-center px-3.5 truncate transition ${row.kind === "lane"
                      ? "text-[10px] font-bold uppercase tracking-wider text-orange-600 dark:text-orange-400 bg-orange-500/5"
                      : `text-[12px] font-medium text-slate-700 dark:text-gray-300 ${row.order === active ? "text-orange-500 font-bold bg-orange-500/10" : ""}`
                      }`}
                  >
                    <span className="truncate">{row.kind === "lane" ? row.lane : row.task.label}</span>
                  </div>
                ))}
              </div>

              {/* Scrolling chart timeline */}
              <div
                ref={scrollRef}
                className="min-w-0 flex-1 overflow-x-auto relative"
                onScroll={(e) => setScrollLeft(e.currentTarget.scrollLeft)}
              >
                <div className="relative" style={{ width: chartWidth }}>
                  <svg
                    width={chartWidth}
                    height={height}
                    className="block outline-none"
                    onPointerMove={(event) => {
                      const rect = event.currentTarget.getBoundingClientRect();
                      const rowIdx = Math.floor((event.clientY - rect.top - GANTT_HEADER) / rowHeight);
                      const r = rows[rowIdx];
                      setActive(r?.kind === "task" ? r.order : null);
                    }}
                    onPointerLeave={() => setActive(null)}
                  >
                    <defs>
                      <marker id="gantt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
                        <path d="M0 0L8 4L0 8z" fill="#f97316" />
                      </marker>
                    </defs>

                    {/* Lane and hover backgrounds */}
                    {rows.map((row, index) =>
                      row.kind === "lane" ? (
                        <rect
                          key={`band-${row.lane}`}
                          x={0}
                          y={GANTT_HEADER + index * rowHeight}
                          width={chartWidth}
                          height={rowHeight}
                          className="fill-orange-500/[0.02]"
                        />
                      ) : (
                        row.order === active && (
                          <rect
                            key="hover"
                            x={0}
                            y={GANTT_HEADER + index * rowHeight}
                            width={chartWidth}
                            height={rowHeight}
                            className="fill-orange-500/[0.05]"
                          />
                        )
                      )
                    )}

                    {/* Timeline Grid ticks */}
                    {ticks.map((tick) => (
                      <g key={tick.date.getTime()}>
                        <line
                          x1={toX(tick.date)}
                          x2={toX(tick.date)}
                          y1={GANTT_HEADER - 6}
                          y2={height}
                          stroke={tick.major ? "rgba(249,115,22,0.25)" : "rgba(150,150,150,0.12)"}
                          strokeWidth="1"
                        />
                        <text
                          x={toX(tick.date) + (zoom === "day" ? unit / 2 : 4)}
                          y={19}
                          textAnchor={zoom === "day" ? "middle" : "start"}
                          className="text-[10px] font-mono fill-slate-400 dark:fill-gray-500"
                        >
                          {tick.text}
                        </text>
                      </g>
                    ))}

                    <line x1={0} x2={chartWidth} y1={GANTT_HEADER} y2={GANTT_HEADER} stroke="rgba(150,150,150,0.18)" strokeWidth="1" />

                    {/* Dependency Arrows */}
                    {ordered.flatMap((task) =>
                      (task.dependsOn || []).map((id) => {
                        const from = ordered.find((entry) => entry.id === id);
                        if (!from) return null;
                        const x1 = from.milestone ? toX(from.start) + unit / 2 + 7 : toX(ganttAddDays(from.end, 1));
                        const y1 = rowY.get(from.id) || 0;
                        const x2 = task.milestone ? toX(task.start) + unit / 2 - 8 : toX(task.start) - 1;
                        const y2 = rowY.get(task.id) || 0;
                        const elbow = Math.max(x1 + 6, Math.min(x2 - 8, x1 + 10));
                        return (
                          <path
                            key={`${id}-${task.id}`}
                            d={`M${x1} ${y1}H${elbow}V${y2}H${x2}`}
                            fill="none"
                            stroke="#f97316"
                            strokeWidth="1.3"
                            strokeOpacity={active === null || current?.id === task.id || current?.id === id ? "0.85" : "0.2"}
                            markerEnd="url(#gantt-arrow)"
                          />
                        );
                      })
                    )}

                    {/* Tasks and Milestones Bars */}
                    {ordered.map((task, index) => {
                      const y = rowY.get(task.id) || 0;
                      const dim = active !== null && active !== index;
                      if (task.milestone) {
                        const x = toX(task.start) + unit / 2;
                        return (
                          <path
                            key={task.id}
                            d={`M${x} ${y - 7}L${x + 7} ${y}L${x} ${y + 7}L${x - 7} ${y}z`}
                            className="fill-amber-400 transition-opacity"
                            opacity={dim ? 0.4 : 1}
                          />
                        );
                      }
                      const x = toX(task.start);
                      const barWidth = Math.max(unit, toX(ganttAddDays(task.end, 1)) - x);
                      const progress = Math.min(1, Math.max(0, task.progress || 0));
                      const barHeight = Math.min(20, rowHeight - 12);
                      return (
                        <g key={task.id} opacity={dim ? 0.5 : 1}>
                          <rect
                            x={x}
                            y={y - barHeight / 2}
                            width={barWidth}
                            height={barHeight}
                            rx={5}
                            fill="rgba(249, 115, 22, 0.18)"
                          />
                          <rect
                            x={x}
                            y={y - barHeight / 2}
                            width={barWidth * progress}
                            height={barHeight}
                            rx={5}
                            fill="#f97316"
                          />
                          {active === index && (
                            <rect
                              x={x - 1.5}
                              y={y - barHeight / 2 - 1.5}
                              width={barWidth + 3}
                              height={barHeight + 3}
                              rx={6}
                              fill="none"
                              stroke="#ea580c"
                              strokeWidth="1.5"
                            />
                          )}
                        </g>
                      );
                    })}

                    {/* Today marker */}
                    {today >= origin && toX(today) <= chartWidth && (
                      <g>
                        <line
                          x1={toX(today) + unit / 2}
                          x2={toX(today) + unit / 2}
                          y1={GANTT_HEADER - 4}
                          y2={height}
                          stroke="#ef4444"
                          strokeWidth="1.5"
                        />
                        <rect
                          x={toX(today) + unit / 2 - 16}
                          y={GANTT_HEADER - 12}
                          width={32}
                          height={12}
                          rx={6}
                          fill="#ef4444"
                        />
                        <text
                          x={toX(today) + unit / 2}
                          y={GANTT_HEADER - 6}
                          textAnchor="middle"
                          dominantBaseline="middle"
                          className="fill-white text-[8px] font-bold"
                        >
                          Today
                        </text>
                      </g>
                    )}
                  </svg>
                </div>
              </div>
            </div>

            {/* Hover Tooltip Popup */}
            {current && (
              <div
                style={{
                  position: 'absolute',
                  left: Math.max(120, Math.min(width - 160, toX(current.start) - scrollLeft + 140)),
                  top: Math.max(10, (rowY.get(current.id) || 0) - 45),
                }}
                className="pointer-events-none z-30 rounded-xl border border-black/10 dark:border-white/10 bg-white/95 dark:bg-[#121217]/95 p-2.5 text-xs text-slate-800 dark:text-white shadow-xl backdrop-blur-md"
              >
                <div className="font-bold text-orange-600 dark:text-orange-400 mb-1">{current.label}</div>
                <div className="flex justify-between gap-4 text-[11px] text-gray-500 dark:text-gray-400">
                  <span>Status:</span>
                  <span className="font-semibold text-slate-700 dark:text-gray-200">
                    {current.milestone ? 'Milestone Complete' : `${Math.round((current.progress || 0) * 100)}% Complete`}
                  </span>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function App() {
      // ── Theme State (Default Dark, persists in localStorage) ──────────
      const [theme, setTheme] = useState(() => localStorage.getItem('theme') || 'dark');

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        localStorage.setItem('theme', theme);
      }, [theme]);

      const handleSkyToggle = (isNight) => {
        setTheme(isNight ? 'dark' : 'light');
      };

      // ── States ────────────────────────────────────────────────────────
      const [stats, setStats] = useState({
        applied_today: 0,
        skipped_today: 0,
        total_applied: 0,
        daily_cap: 20,
        daily_progress: 0,
        last_boost: null,
        runs: [],
        chart: { labels: [], applied: [], skipped: [] }
      });

      const [jobs, setJobs] = useState([]);
      const [jobFilter, setJobFilter] = useState('all');
      const [activeTab, setActiveTab] = useState('jobs');
      const [running, setRunning] = useState({});
      const [logs, setLogs] = useState([]);
      const [connected, setConnected] = useState(false);
      const [sessionInfo, setSessionInfo] = useState(null);
      const [connectOpen, setConnectOpen] = useState(false);
      const [profileMenuOpen, setProfileMenuOpen] = useState(false);
      const profileMenuRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (profileMenuRef.current && !profileMenuRef.current.contains(e.target)) {
            setProfileMenuOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const fetchSession = async () => {
        try {
          const r = await fetch('/api/session-status');
          const data = await r.json();
          setSessionInfo(data);
        } catch (e) { }
      };

      const handleDisconnect = async () => {
        try {
          const r = await fetch('/api/disconnect', { method: 'POST' });
          const d = await r.json();
          if (d.ok) {
            notify('success', 'Account Disconnected', 'Your credentials and session were cleared.');
            setSessionInfo({ configured: false, email: '' });
            setProfileMenuOpen(false);
            setConnectOpen(true);
          } else {
            notify('error', 'Error', d.error || 'Failed to disconnect account.');
          }
        } catch (err) {
          notify('error', 'Network Error', 'Server unreachable.');
        }
      };

      const handleLogout = async () => {
        await handleDisconnect();
        window.location.reload();
      };

      // Load session info once
      useEffect(() => {
        fetchSession();
      }, []);

      // Splashed Push Notifications ref & helper
      const notifyRef = useRef(null);
      const prevRunningRef = useRef({});

      const notify = (type, title, content) => {
        if (notifyRef.current) {
          notifyRef.current.createNotification(type, title, content);
        }
      };

      // Pagination States (10 items per page)
      const [jobsPage, setJobsPage] = useState(1);
      const [runsPage, setRunsPage] = useState(1);
      const itemsPerPage = 10;

      const [config, setConfig] = useState({
        keywords: [],
        locations: [],
        experience_years: 0,
        min_salary_lpa: 0,
        max_applications_per_run: 15,
        max_applications_per_day: 20,
        include_words: [],
        exclude_words: [],
        exclude_companies: []
      });

      const chartRef = useRef(null);
      const chartInstance = useRef(null);
      const logContainerRef = useRef(null);

      // ── API Fetchers ──────────────────────────────────────────────────
      const fetchStats = async () => {
        try {
          const res = await fetch('/api/stats');
          const data = await res.json();
          setStats(data);
        } catch (err) {
          console.error("Failed to load stats", err);
        }
      };

      const fetchJobs = async () => {
        try {
          const res = await fetch(`/api/jobs?status=${jobFilter}&limit=100`);
          const data = await res.json();
          setJobs(data);
          setJobsPage(1);
        } catch (err) {
          console.error("Failed to load jobs", err);
        }
      };

      const fetchConfig = async () => {
        try {
          const res = await fetch('/api/config');
          const data = await res.json();
          setConfig(data);
        } catch (err) {
          console.error("Failed to load config", err);
        }
      };

      const fetchStatus = async () => {
        try {
          const res = await fetch('/api/status');
          const data = await res.json();

          // Auto alert on action completion
          Object.entries(prevRunningRef.current).forEach(([mode, prev]) => {
            if (prev && prev.active && data[mode] && !data[mode].active) {
              notify('success', `${mode.toUpperCase()} Completed`, 'Automation finished successfully. Results updated.');
              fetchStats();
              fetchJobs();
            }
          });
          prevRunningRef.current = data;
          setRunning(data);
        } catch (err) { }
      };

      // ── Action Trigger ────────────────────────────────────────────────
      const triggerAction = async (mode, dryRun = false) => {
        try {
          const res = await fetch(`/api/action/${mode}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dry_run: dryRun })
          });
          const data = await res.json();
          if (data.error) {
            notify('error', 'Execution Blocked', data.error);
          } else {
            notify(
              'warning',
              `${mode.toUpperCase()} Initiated`,
              dryRun ? 'Dry-run preview running. Streaming live logs below.' : 'Browser automation active. Live progress streaming below.'
            );
            fetchStatus();
          }
        } catch (err) {
          notify('error', 'Launch Failed', 'Failed to launch background automation process');
        }
      };

      // ── Save Config ───────────────────────────────────────────────────
      const handleSaveConfig = async (e) => {
        e.preventDefault();
        try {
          await fetch('/api/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(config)
          });
          notify('success', 'Configuration Updated', 'Filter and run settings successfully saved!');
        } catch (err) {
          notify('error', 'Save Failed', 'Failed to save configuration');
        }
      };

      // ── SSE Logs Setup ────────────────────────────────────────────────
      useEffect(() => {
        const es = new EventSource('/api/logs/stream');
        es.onopen = () => setConnected(true);
        es.onerror = () => setConnected(false);
        es.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.log) {
              setLogs((prev) => [...prev.slice(-250), data.log]);
            }
          } catch (e) { }
        };
        return () => es.close();
      }, []);

      // Auto-scroll log window
      useEffect(() => {
        if (logContainerRef.current) {
          logContainerRef.current.scrollTop = logContainerRef.current.scrollHeight;
        }
      }, [logs]);

      // Lifecycle Intervals
      useEffect(() => {
        fetchStats();
        fetchJobs();
        fetchConfig();
        fetchStatus();

        const statusInterval = setInterval(fetchStatus, 3000);
        const statsInterval = setInterval(() => {
          fetchStats();
          fetchJobs();
        }, 12000);

        return () => {
          clearInterval(statusInterval);
          clearInterval(statsInterval);
        };
      }, [jobFilter]);

      // ── Chart.js Lifecycle (Theme-aware) ──────────────────────────────
      useEffect(() => {
        if (!chartRef.current || !stats.chart) return;

        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const isDark = theme === 'dark';
        const textColor = isDark ? '#9ca3af' : '#64748b';
        const gridColor = isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.05)';

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: stats.chart.labels || [],
            datasets: [
              {
                label: 'Applied',
                data: stats.chart.applied || [],
                backgroundColor: 'rgba(34, 197, 94, 0.75)',
                borderRadius: 6,
                barPercentage: 0.6
              },
              {
                label: 'Skipped',
                data: stats.chart.skipped || [],
                backgroundColor: 'rgba(234, 179, 8, 0.4)',
                borderRadius: 6,
                barPercentage: 0.6
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                labels: { color: textColor, font: { size: 12, family: 'Plus Jakarta Sans' } }
              }
            },
            scales: {
              x: {
                ticks: { color: textColor, font: { size: 11 } },
                grid: { display: false }
              },
              y: {
                beginAtZero: true,
                ticks: { color: textColor, stepSize: 5 },
                grid: { color: gridColor }
              }
            }
          }
        });

        return () => {
          if (chartInstance.current) chartInstance.current.destroy();
        };
      }, [stats.chart, theme]);

      // Process detection
      const isAnyActive = Object.values(running).some((r) => r.active);
      const activeRunningName = Object.entries(running).find(([_, r]) => r.active)?.[0];
      const isConnected = Boolean(sessionInfo?.configured);

      // ── Dynamic Milestones for Gantt Roadmap (21st.dev/r/klyv-ui/gantt-chart) ──
      const dynamicMilestones = useMemo(() => {
        const t0 = ganttStartOfDay(new Date());
        const isAuth = Boolean(sessionInfo?.configured);
        const appliedToday = stats.applied_today || 0;
        const dailyCap = stats.daily_cap || 20;
        const applyRatio = Math.min(1.0, dailyCap > 0 ? (appliedToday / dailyCap) : 0);
        const hasBoost = Boolean(stats.last_boost);
        const skipped = stats.skipped_today || 0;
        const totalApplied = stats.total_applied || 0;

        return [
          {
            id: "auth",
            label: isAuth ? `Naukri Vault Connected (${sessionInfo?.email || 'Active'})` : "Connect Naukri Account",
            lane: "Pipeline Setup",
            start: ganttAddDays(t0, -3),
            end: ganttAddDays(t0, -1),
            progress: isAuth ? 1.0 : 0.0,
          },
          {
            id: "skills",
            label: isAuth ? "Resume Skills & Keywords Synchronized" : "Skill Extraction Pending Auth",
            lane: "Pipeline Setup",
            start: ganttAddDays(t0, -2),
            end: ganttAddDays(t0, 0),
            progress: isAuth ? 1.0 : 0.25,
            dependsOn: ["auth"],
          },
          {
            id: "boost",
            label: hasBoost ? "Headline Timestamp Touched (Top Rank)" : "Profile Freshness Boost",
            lane: "Profile Ranking",
            start: ganttAddDays(t0, 0),
            end: ganttAddDays(t0, 0),
            milestone: true,
            dependsOn: ["skills"],
          },
          {
            id: "filter",
            label: `Negative Keyword Guard (${skipped} Filtered Today)`,
            lane: "Daily Automation",
            start: ganttAddDays(t0, -1),
            end: ganttAddDays(t0, 1),
            progress: skipped > 0 ? 1.0 : (isAuth ? 0.75 : 0.15),
            dependsOn: ["auth"],
          },
          {
            id: "apply",
            label: `Auto-Apply Daily Progress (${appliedToday}/${dailyCap} Applied)`,
            lane: "Daily Automation",
            start: ganttAddDays(t0, 0),
            end: ganttAddDays(t0, 2),
            progress: applyRatio,
            dependsOn: ["filter", "boost"],
          },
          {
            id: "reach",
            label: `Recruiter Search Visibility Ranking (${totalApplied} Cumulative App)`,
            lane: "Recruiter Pipeline",
            start: ganttAddDays(t0, 1),
            end: ganttAddDays(t0, 4),
            progress: totalApplied > 0 ? 0.85 : 0.35,
            dependsOn: ["apply"],
          },
          {
            id: "interview",
            label: "Recruiter Shortlisting & Interview Calls",
            lane: "Recruiter Pipeline",
            start: ganttAddDays(t0, 4),
            end: ganttAddDays(t0, 4),
            milestone: true,
            dependsOn: ["reach"],
          },
        ];
      }, [sessionInfo, stats]);

      // ── Pagination Calculation ────────────────────────────────────────
      const totalJobPages = Math.max(1, Math.ceil(jobs.length / itemsPerPage));
      const displayedJobs = jobs.slice((jobsPage - 1) * itemsPerPage, jobsPage * itemsPerPage);

      const totalRuns = stats.runs || [];
      const totalRunPages = Math.max(1, Math.ceil(totalRuns.length / itemsPerPage));
      const displayedRuns = totalRuns.slice((runsPage - 1) * itemsPerPage, runsPage * itemsPerPage);

      return (
        <div className="min-h-screen flex flex-col">
          {/* ═══ Header / Navbar with Brand Logo & Sky Toggle ═══ */}
          <header className="glass sticky top-0 z-50 px-6 py-2 flex items-center justify-between border-b border-black/[0.06] dark:border-white/5">
            <div className="flex items-center gap-3">
              {/* Dynamic Theme Logo (Transparent, Enlarged) */}
              <div className="flex items-center cursor-pointer select-none">
                <img
                  src={theme === 'dark' ? '/static/images/logo-dark.svg' : '/static/images/logo-light.svg'}
                  alt="KLyck Job Assistant"
                  className="h-12 md:h-14 w-auto object-contain transition-all duration-300 drop-shadow-sm hover:scale-105"
                />
              </div>
            </div>

            <div className="flex items-center gap-4">
              {/* Sky Toggle Theme Switcher Component */}
              <div className="flex items-center gap-2 px-2 py-1 rounded-full bg-black/[0.03] dark:bg-white/[0.04] border border-black/[0.06] dark:border-white/5">
                <SkyToggle checked={theme === 'dark'} onChange={handleSkyToggle} />
              </div>

              {/* Profile Account Dropdown */}
              {sessionInfo && sessionInfo.email ? (
                <div className="relative" ref={profileMenuRef}>
                  <button
                    onClick={() => setProfileMenuOpen(!profileMenuOpen)}
                    className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/[0.04] dark:bg-white/[0.04] border border-black/[0.08] dark:border-white/10 hover:border-orange-500/40 dark:hover:border-orange-500/40 transition shadow-sm"
                  >
                    <div className="w-5 h-5 rounded-full bg-gradient-to-tr from-orange-500 to-amber-500 flex items-center justify-center text-white text-[10px] font-bold shadow-sm">
                      {sessionInfo.email[0].toUpperCase()}
                    </div>
                    <span className="text-xs font-semibold text-slate-700 dark:text-gray-200">{sessionInfo.email}</span>
                    <svg className={`w-3.5 h-3.5 text-gray-400 transition-transform ${profileMenuOpen ? 'rotate-180 text-orange-500' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
                    </svg>
                  </button>

                  {/* Dropdown Menu */}
                  {profileMenuOpen && (

                          <span className="font-semibold text-slate-900 dark:text-white">{Math.min(jobsPage * itemsPerPage, jobs.length)}</span> of{' '}
                          <span className="font-semibold text-slate-900 dark:text-white">{jobs.length}</span> jobs (10 per page)
                        </div>

                        <div className="flex items-center gap-1.5">
                          <button
                            onClick={() => setJobsPage(prev => Math.max(1, prev - 1))}
                            disabled={jobsPage === 1}
                            className="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-white/10 text-xs font-semibold text-slate-700 dark:text-gray-300 hover:bg-black/[0.05] dark:hover:bg-white/[0.05] disabled:opacity-40 disabled:cursor-not-allowed transition"
                          >
                            Previous
                          </button>

                          {Array.from({ length: totalJobPages }, (_, i) => i + 1)
                            .filter(page => page === 1 || page === totalJobPages || Math.abs(page - jobsPage) <= 1)
                            .map((page, index, array) => {
                              const showDots = index > 0 && page - array[index - 1] > 1;
                              return (
                                <React.Fragment key={page}>
                                  {showDots && <span className="px-1 text-slate-400 text-xs">…</span>}
                                  <button
                                    onClick={() => setJobsPage(page)}
                                    className={`w-7 h-7 rounded-lg text-xs font-semibold transition ${jobsPage === page
                                      ? 'bg-brand-600 text-white shadow-sm'
                                      : 'border border-slate-300 dark:border-white/10 text-slate-700 dark:text-gray-300 hover:bg-black/[0.05] dark:hover:bg-white/[0.05]'
                                      }`}
                                  >
                                    {page}
                                  </button>
                                </React.Fragment>
                              );
                            })}

                          <button
                            onClick={() => setJobsPage(prev => Math.min(totalJobPages, prev + 1))}
                            disabled={jobsPage === totalJobPages}
                            className="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-white/10 text-xs font-semibold text-slate-700 dark:text-gray-300 hover:bg-black/[0.05] dark:hover:bg-white/[0.05] disabled:opacity-40 disabled:cursor-not-allowed transition"
                          >
                            Next
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* Milestones Tab View */}
                {activeTab === 'milestones' && (
                  <div className="space-y-6">
                    <div className="p-4 rounded-xl bg-orange-500/5 border border-orange-500/20 flex items-center justify-between">
                      <div>
                        <h4 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                          <span className="w-2 h-2 rounded-full bg-orange-500 animate-ping" />
                          KLyck Milestone Roadmap Telemetry
                        </h4>
                        <p className="text-xs text-slate-500 dark:text-gray-400 mt-1">
                          Calculated in real-time from your active profile connection, daily apply caps, and recruiter reach index.
                        </p>
                      </div>
                      <span className="text-xs font-mono px-3 py-1 rounded-full bg-orange-500/10 text-orange-600 dark:text-orange-400 font-bold">
                        {stats.applied_today}/{stats.daily_cap || 20} Applied Today
                      </span>
                    </div>

                    <GanttChartComponent
                      tasks={dynamicMilestones}
                      label="Milestone Pipeline"
                      defaultZoom="week"
                      rowHeight={40}
                    />

                    {/* Breakdown Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                      <div className="p-4 rounded-xl border border-black/5 dark:border-white/5 bg-black/[0.02] dark:bg-white/[0.02]">
                        <div className="text-xs font-bold text-orange-600 dark:text-orange-400 uppercase tracking-wider mb-1">Phase 1: Setup & Sync</div>
                        <p className="text-xs text-slate-600 dark:text-gray-300">
                          {isConnected ? '✓ Credentials vaulted & resume skills extracted.' : 'Connect account to verify credential token and resume skills.'}
                        </p>
                      </div>
                      <div className="p-4 rounded-xl border border-black/5 dark:border-white/5 bg-black/[0.02] dark:bg-white/[0.02]">
                        <div className="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider mb-1">Phase 2: Freshness Ranking</div>
                        <p className="text-xs text-slate-600 dark:text-gray-300">
                          {stats.last_boost ? `✓ Profile headline refreshed (${new Date(stats.last_boost).toLocaleDateString()}).` : 'Touch headline timestamp to move to top of recruiter searches.'}
                        </p>
                      </div>
                      <div className="p-4 rounded-xl border border-black/5 dark:border-white/5 bg-black/[0.02] dark:bg-white/[0.02]">
                        <div className="text-xs font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider mb-1">Phase 3: Automated Applications</div>
                        <p className="text-xs text-slate-600 dark:text-gray-300">
                          {stats.applied_today > 0 ? `✓ ${stats.applied_today} applications dispatched today with zero spam.` : 'Auto-apply engine searches matching criteria while skipping negative keywords.'}
                        </p>
                      </div>
                    </div>
                  </div>
                )}

                {/* Configuration Tab View */}
                {activeTab === 'config' && (
                  <form onSubmit={handleSaveConfig} className="space-y-6 max-w-4xl">
                    <div className="grid md:grid-cols-2 gap-6">
                      <div className="space-y-4">
                        <h4 className="text-xs font-bold uppercase tracking-wider text-brand-600 dark:text-brand-400">Search Target</h4>
                        <div>
                          <label className="text-xs text-slate-600 dark:text-gray-400 block mb-1">Keywords (comma separated)</label>
                          <input
                            type="text"
                            value={config.keywords?.join(', ') || ''}
                            onChange={(e) => setConfig({ ...config, keywords: e.target.value.split(',').map(s => s.trim()).filter(Boolean) })}
                            className="w-full bg-slate-50 dark:bg-surface-900 border border-slate-300 dark:border-white/10 rounded-xl px-3.5 py-2 text-sm text-slate-900 dark:text-white focus:border-brand-500 focus:outline-none"
                          />
                        </div>
                        <div>
                          <label className="text-xs text-slate-600 dark:text-gray-400 block mb-1">Location</label>
                          <input
                            type="text"
                            value={config.locations?.join(', ') || ''}
                            onChange={(e) => setConfig({ ...config, locations: e.target.value.split(',').map(s => s.trim()).filter(Boolean) })}
                            className="w-full bg-slate-50 dark:bg-surface-900 border border-slate-300 dark:border-white/10 rounded-xl px-3.5 py-2 text-sm text-slate-900 dark:text-white focus:border-brand-500 focus:outline-none"
                          />
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="text-xs text-slate-600 dark:text-gray-400 block mb-1">Years Experience</label>
                            <input
                              type="number"
                              value={config.experience_years ?? 0}
                              onChange={(e) => setConfig({ ...config, experience_years: parseInt(e.target.value) || 0 })}
                              className="w-full bg-slate-50 dark:bg-surface-900 border border-slate-300 dark:border-white/10 rounded-xl px-3.5 py-2 text-sm text-slate-900 dark:text-white focus:border-brand-500 focus:outline-none"
                            />
                          </div>
                          <div>
                            <label className="text-xs text-slate-600 dark:text-gray-400 block mb-1">Min Salary (LPA)</label>
                            <input
                              type="number"
                              value={config.min_salary_lpa ?? 0}
                              onChange={(e) => setConfig({ ...config, min_salary_lpa: parseInt(e.target.value) || 0 })}
                              className="w-full bg-slate-50 dark:bg-surface-900 border border-slate-300 dark:border-white/10 rounded-xl px-3.5 py-2 text-sm text-slate-900 dark:text-white focus:border-brand-500 focus:outline-none"
                            />
                          </div>
                        </div>
                      </div>

                      <div className="space-y-4">
                        <h4 className="text-xs font-bold uppercase tracking-wider text-brand-600 dark:text-brand-400">Content Filtering</h4>
                        <div>
                          <label className="text-xs text-slate-600 dark:text-gray-400 block mb-1">Include Words (Skills required)</label>
                          <textarea
                            rows="2"
                            value={config.include_words?.join(', ') || ''}
                            onChange={(e) => setConfig({ ...config, include_words: e.target.value.split(',').map(s => s.trim()).filter(Boolean) })}
                            className="w-full bg-slate-50 dark:bg-surface-900 border border-slate-300 dark:border-white/10 rounded-xl px-3.5 py-2 text-sm text-slate-900 dark:text-white focus:border-brand-500 focus:outline-none resize-none"
                          />
                        </div>
                        <div>
                          <label className="text-xs text-slate-600 dark:text-gray-400 block mb-1">Exclude Words (Title / description)</label>
                          <textarea
                            rows="2"
                            value={config.exclude_words?.join(', ') || ''}
                            onChange={(e) => setConfig({ ...config, exclude_words: e.target.value.split(',').map(s => s.trim()).filter(Boolean) })}
                            className="w-full bg-slate-50 dark:bg-surface-900 border border-slate-300 dark:border-white/10 rounded-xl px-3.5 py-2 text-sm text-slate-900 dark:text-white focus:border-brand-500 focus:outline-none resize-none"
                          />
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="text-xs text-slate-600 dark:text-gray-400 block mb-1">Max Apps / Run</label>
                            <input
                              type="number"
                              value={config.max_applications_per_run ?? 15}
                              onChange={(e) => setConfig({ ...config, max_applications_per_run: parseInt(e.target.value) || 15 })}
                              className="w-full bg-slate-50 dark:bg-surface-900 border border-slate-300 dark:border-white/10 rounded-xl px-3.5 py-2 text-sm text-slate-900 dark:text-white focus:border-brand-500 focus:outline-none"
                            />
                          </div>
                          <div>
                            <label className="text-xs text-slate-600 dark:text-gray-400 block mb-1">Max Apps / Day</label>
                            <input
                              type="number"
                              value={config.max_applications_per_day ?? 20}
                              onChange={(e) => setConfig({ ...config, max_applications_per_day: parseInt(e.target.value) || 20 })}
                              className="w-full bg-slate-50 dark:bg-surface-900 border border-slate-300 dark:border-white/10 rounded-xl px-3.5 py-2 text-sm text-slate-900 dark:text-white focus:border-brand-500 focus:outline-none"
                            />
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="flex justify-end pt-2">
                      <button
                        type="submit"
                        className="px-6 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-sm transition shadow-lg shadow-brand-500/25"
                      >
                        Save Configuration
                      </button>
                    </div>
                  </form>
                )}

                {/* ═══ Runs Tab with 10 Items Pagination ═══ */}
                {activeTab === 'runs' && (
                  <div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-sm">
                        <thead>
                          <tr className="text-xs uppercase text-slate-400 dark:text-gray-500 border-b border-black/[0.06] dark:border-white/5">
                            <th className="pb-3 pr-4">Mode</th>
                            <th className="pb-3 pr-4">Status</th>
                            <th className="pb-3 pr-4">Applied</th>
                            <th className="pb-3 pr-4">Skipped</th>
                            <th className="pb-3 pr-4">Started</th>
                            <th className="pb-3">Notes</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-black/[0.04] dark:divide-white/5">
                          {displayedRuns.length === 0 ? (
                            <tr><td colSpan="6" className="py-8 text-center text-slate-400 dark:text-gray-500">No runs tracked yet.</td></tr>
                          ) : (
                            displayedRuns.map((r) => (
                              <tr key={r.id} className="hover:bg-black/[0.02] dark:hover:bg-white/[0.02] transition">
                                <td className="py-3 pr-4 font-semibold capitalize text-slate-900 dark:text-white">{r.mode}</td>
                                <td className="py-3 pr-4">
                                  <span className={`px-2.5 py-0.5 rounded-full text-xs font-semibold ${r.status === 'ok' ? 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-400' :
                                    r.status === 'running' ? 'bg-brand-500/15 text-brand-700 dark:text-brand-300' :
                                      'bg-rose-500/15 text-rose-700 dark:text-rose-400'
                                    }`}>
                                    {r.status}
                                  </span>
                                </td>
                                <td className="py-3 pr-4 text-emerald-600 dark:text-emerald-400 font-semibold">{r.applied}</td>
                                <td className="py-3 pr-4 text-amber-600 dark:text-amber-400 font-semibold">{r.skipped}</td>
                                <td className="py-3 pr-4 text-xs text-slate-500 dark:text-gray-400 whitespace-nowrap">
                                  {r.started_at ? new Date(r.started_at).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }) : '—'}
                                </td>
                                <td className="py-3 text-xs text-slate-500 dark:text-gray-400 max-w-xs truncate">{r.notes || '—'}</td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>

                    {/* Pagination Bar for Runs */}
                    {totalRuns.length > 0 && (
                      <div className="flex items-center justify-between border-t border-black/[0.06] dark:border-white/5 pt-4 mt-2">
                        <div className="text-xs text-slate-500 dark:text-gray-400">
                          Showing <span className="font-semibold text-slate-900 dark:text-white">{Math.min((runsPage - 1) * itemsPerPage + 1, totalRuns.length)}</span> to{' '}
                          <span className="font-semibold text-slate-900 dark:text-white">{Math.min(runsPage * itemsPerPage, totalRuns.length)}</span> of{' '}
                          <span className="font-semibold text-slate-900 dark:text-white">{totalRuns.length}</span> runs (10 per page)
                        </div>

                        <div className="flex items-center gap-1.5">
                          <button
                            onClick={() => setRunsPage(prev => Math.max(1, prev - 1))}
                            disabled={runsPage === 1}
                            className="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-white/10 text-xs font-semibold text-slate-700 dark:text-gray-300 hover:bg-black/[0.05] dark:hover:bg-white/[0.05] disabled:opacity-40 disabled:cursor-not-allowed transition"
                          >
                            Previous
                          </button>

                          {Array.from({ length: totalRunPages }, (_, i) => i + 1).map((page) => (
                            <button
                              key={page}
                              onClick={() => setRunsPage(page)}
                              className={`w-7 h-7 rounded-lg text-xs font-semibold transition ${runsPage === page
                                ? 'bg-brand-600 text-white shadow-sm'
                                : 'border border-slate-300 dark:border-white/10 text-slate-700 dark:text-gray-300 hover:bg-black/[0.05] dark:hover:bg-white/[0.05]'
                                }`}
                            >
                              {page}
                            </button>
                          ))}

                          <button
                            onClick={() => setRunsPage(prev => Math.min(totalRunPages, prev + 1))}
                            disabled={runsPage === totalRunPages}
                            className="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-white/10 text-xs font-semibold text-slate-700 dark:text-gray-300 hover:bg-black/[0.05] dark:hover:bg-white/[0.05] disabled:opacity-40 disabled:cursor-not-allowed transition"
                          >
                            Next
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>

          </main>

          {/* ═══ Splashed Push Notifications (Right Side Alert Popup) ═══ */}
          <SplashedPushNotifications ref={notifyRef} />
        </div>
      );
    }

    window.addEventListener('error', function (e) {
      console.error('Captured dashboard error:', e);
      const rootEl = document.getElementById('root');
      if (rootEl && (!rootEl.hasChildNodes() || rootEl.innerHTML === '')) {
        rootEl.innerHTML = `
          <div style="padding: 50px 20px; color: #ef4444; font-family: ui-sans-serif, system-ui, sans-serif; text-align: center;">
            <div style="display: inline-block; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 16px; padding: 24px; max-width: 500px;">
              <h2 style="font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #f87171;">Dashboard Initialization Error</h2>
              <p style="color: #cbd5e1; font-size: 13px; margin-bottom: 16px; font-family: monospace;">${e.message || 'Script error'}</p>
              <button onclick="window.location.reload()" style="background: #f97316; color: white; border: none; padding: 8px 18px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: bold;">
                Reload Dashboard
              </button>
            </div>
          </div>
        `;
      }
    });

    try {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    } catch (err) {
      console.error('Mounting error:', err);
    }
  </script>
</body>

</html>
