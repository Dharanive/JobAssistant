<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KLyck – Smart Job Auto-Apply Assistant</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <link rel="alternate icon" href="/static/images/favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' },
            surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 700: '#334155', 800: '#1e1b2e', 850: '#181528', 900: '#13111c', 950: '#0c0a14' }
          },
          animation: {
            'orb-spin': 'orb-spin 20s linear infinite',
            'rise': 'rise 0.7s ease forwards',
            'rise-2': 'rise 0.7s 0.15s ease both',
            'rise-3': 'rise 0.7s 0.3s ease both',
            'underline-draw': 'underline-draw 1.1s 0.6s cubic-bezier(.25,.46,.45,.94) forwards',
            'caret-blink': 'caret-blink 1.2s step-end infinite',
            'button-sweep': 'button-sweep 2.4s 1.2s ease-in-out infinite',
            'float': 'float 6s ease-in-out infinite',
            'float-2': 'float 8s ease-in-out infinite alternate',
          },
          keyframes: {
            'orb-spin': { to: { transform: 'rotate(360deg)' } },
            'rise': { from: { opacity: '0', transform: 'translateY(20px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
            'underline-draw': { to: { 'stroke-dashoffset': '0' } },
            'caret-blink': { '50%': { opacity: '0' } },
            'button-sweep': { '0%,60%': { left: '-60%' }, '100%': { left: '130%' } },
            'float': { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-12px)' } },
          }
        }
      }
    }
  </script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; margin: 0; }

    @keyframes orb-spin { to { transform: rotate(360deg); } }
    @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes underline-draw { to { stroke-dashoffset: 0; } }
    @keyframes button-sweep { 0%,60% { left: -60%; } 100% { left: 130%; } }
    @keyframes caret-blink { 50% { opacity: 0; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.6); opacity: 0; } }

    .animate-orb-spin { animation: orb-spin 20s linear infinite; }
    .animate-rise { animation: rise 0.7s ease both; }
    .animate-rise-2 { animation: rise 0.7s 0.15s ease both; }
    .animate-rise-3 { animation: rise 0.7s 0.3s ease both; }
    .animate-rise-4 { animation: rise 0.7s 0.45s ease both; }
    .animate-underline { animation: underline-draw 1.1s 0.6s cubic-bezier(.25,.46,.45,.94) forwards; }
    .animate-sweep { animation: button-sweep 2.4s 1.2s ease-in-out infinite; }
    .animate-caret { animation: caret-blink 1.2s step-end infinite; }
    .animate-float { animation: float 6s ease-in-out infinite; }
    .animate-float-2 { animation: float 8s ease-in-out infinite alternate; }
    .pulse-ring { animation: pulse-ring 2s ease-out infinite; }

    .glass-dark {
      background: rgba(19, 17, 28, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .gradient-border {
      background: linear-gradient(135deg, rgba(99,102,241,0.3), rgba(168,85,247,0.2), rgba(99,102,241,0.1));
      border: 1px solid rgba(99,102,241,0.25);
    }
    .input-field {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.1);
      color: white;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 15px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    .input-field:focus {
      border-color: rgba(99,102,241,0.7);
      background: rgba(99,102,241,0.08);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }
    .input-field::placeholder { color: rgba(255,255,255,0.3); }
    .input-field:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 100px #1e1b2e inset;
      -webkit-text-fill-color: white;
    }

    .crowd-figure {
      position: absolute;
      will-change: transform;
      pointer-events: none;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 9999px; }
  </style>
</head>

<body class="bg-surface-950 text-white min-h-screen overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── Feature Cards Data ──────────────────────────────────────────────
    const FEATURES = [
      {
        icon: (
          <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        ),
        title: "Profile Boost",
        desc: "Automatically updates your Naukri headline timestamp to stay on top of recruiter search results.",
        color: "from-indigo-500/20 to-purple-500/10",
        accent: "text-indigo-400"
      },
      {
        icon: (
          <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        ),
        title: "Auto Apply",
        desc: "Intelligently applies to matching jobs, skipping irrelevant ones based on your keyword filters.",
        color: "from-emerald-500/20 to-teal-500/10",
        accent: "text-emerald-400"
      },
      {
        icon: (
          <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        ),
        title: "Resume Sync",
        desc: "Extracts your current skills and experience from your Naukri profile to auto-tune search filters.",
        color: "from-cyan-500/20 to-blue-500/10",
        accent: "text-cyan-400"
      },
      {
        icon: (
          <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        ),
        title: "Dry Run Mode",
        desc: "Preview which jobs would be applied to without actually submitting — perfect for fine-tuning filters.",
        color: "from-amber-500/20 to-orange-500/10",
        accent: "text-amber-400"
      },
      {
        icon: (
          <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
        ),
        title: "Live Analytics",
        desc: "Real-time dashboard with job application trends, skip/apply ratio, and 7-day history charts.",
        color: "from-purple-500/20 to-pink-500/10",
        accent: "text-purple-400"
      },
      {
        icon: (
          <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        ),
        title: "Secure Credentials",
        desc: "Credentials are stored locally in your .env file — never sent to any cloud server or third party.",
        color: "from-rose-500/20 to-red-500/10",
        accent: "text-rose-400"
      }
    ];

    // ── Stats Section ───────────────────────────────────────────────────
    const STATS = [
      { value: "10×", label: "More Visible", sub: "Profile boost frequency" },
      { value: "500+", label: "Jobs Analysed", sub: "Per run on average" },
      { value: "< 1s", label: "Per Application", sub: "Lightning fast browser automation" },
      { value: "100%", label: "Local & Private", sub: "No data leaves your machine" },
    ];

    // ── Login Form Component ───────────────────────────────────────────
    function LoginForm() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPass, setShowPass] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!email || !password) {
          setError('Please enter both email and password.');
          return;
        }
        setLoading(true);
        setError('');
        setSuccess('');
        try {
          const res = await fetch('/api/connect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (data.ok) {
            setSuccess(data.message || 'Connected! Launching dashboard...');
            setTimeout(() => {
              window.location.href = '/dashboard';
            }, 1200);
          } else {
            setError(data.error || 'Connection failed. Please try again.');
          }
        } catch (err) {
          setError('Network error. Is the server running?');
        } finally {
          setLoading(false);
        }
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-4 w-full">
          <div>
            <label className="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-2">
              Naukri Email
            </label>
            <div className="relative">
              <span className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
              </span>
              <input
                type="email"
                value={email}
                onChange={e => setEmail(e.target.value)}
                placeholder="yourname@example.com"
                className="input-field pl-11"
                autoComplete="email"
                required
              />
            </div>
          </div>

          <div>
            <label className="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-2">
              Naukri Password
            </label>
            <div className="relative">
              <span className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
              </span>
              <input
                type={showPass ? 'text' : 'password'}
                value={password}
                onChange={e => setPassword(e.target.value)}
                placeholder="Your Naukri password"
                className="input-field pl-11 pr-11"
                autoComplete="current-password"
                required
              />
              <button
                type="button"
                onClick={() => setShowPass(!showPass)}
                className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition"
              >
                {showPass ? (
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                  </svg>
                ) : (
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                  </svg>
                )}
              </button>
            </div>
          </div>

          {error && (
            <div className="flex items-center gap-2.5 bg-rose-500/15 border border-rose-500/30 rounded-xl px-4 py-3 text-sm text-rose-300">
              <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              {error}
            </div>
          )}

          {success && (
            <div className="flex items-center gap-2.5 bg-emerald-500/15 border border-emerald-500/30 rounded-xl px-4 py-3 text-sm text-emerald-300">
              <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              {success}
            </div>
          )}

          <button
            type="submit"
            disabled={loading}
            className="relative group w-full overflow-hidden rounded-xl bg-gradient-to-b from-indigo-500 to-indigo-700 px-6 py-3.5 font-bold text-white text-[15px] shadow-[0_0_0_1px_rgba(99,102,241,0.6),0_12px_32px_-8px_rgba(99,102,241,0.75)] hover:shadow-[0_0_0_1px_rgba(99,102,241,0.8),0_16px_40px_-8px_rgba(99,102,241,0.85)] transition-all duration-200 disabled:opacity-60 disabled:cursor-not-allowed"
          >
            <span className="animate-sweep absolute inset-y-0 -left-[60%] w-[40%] skew-x-[-20deg] bg-gradient-to-r from-transparent via-white/40 to-transparent pointer-events-none" />
            {loading ? (
              <span className="flex items-center justify-center gap-2">
                <svg className="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                  <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                  <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
                </svg>
                Connecting...
              </span>
            ) : (
              <span className="flex items-center justify-center gap-2">
                Connect & Launch Dashboard
                <svg className="w-4 h-4 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 12h14M13 6l6 6-6 6" />
                </svg>
              </span>
            )}
          </button>

          <p className="text-center text-xs text-gray-600 mt-2 leading-relaxed">
            🔒 Your credentials are saved <strong className="text-gray-400">only locally</strong> in <code className="bg-white/5 px-1.5 py-0.5 rounded text-indigo-300">.env</code> on this machine. Never transmitted anywhere.
          </p>
        </form>
      );
    }

    // ── Feature Card ──────────────────────────────────────────────────
    function FeatureCard({ icon, title, desc, color, accent, delay }) {
      return (
        <div
          className={`relative rounded-2xl p-5 bg-gradient-to-br ${color} border border-white/5 hover:border-white/10 transition-all duration-300 hover:-translate-y-1 group`}
          style={{ animationDelay: delay }}
        >
          <div className={`w-10 h-10 rounded-xl flex items-center justify-center mb-4 bg-white/5 ${accent} group-hover:scale-110 transition-transform duration-200`}>
            {icon}
          </div>
          <h3 className="font-bold text-white text-[15px] mb-2">{title}</h3>
          <p className="text-sm text-gray-500 leading-relaxed">{desc}</p>
        </div>
      );
    }

    // ── Animated Background Orb ───────────────────────────────────────
    function OrbBg() {
      return (
        <>
          <div
            className="pointer-events-none absolute left-1/2 top-[-300px] -ml-[500px] h-[800px] w-[1000px] rounded-full opacity-[0.22] blur-[160px]"
            style={{
              background: 'conic-gradient(from 0deg, #818cf8, #6366f1, #4f46e5, #7c3aed, #818cf8)',
              animation: 'orb-spin 24s linear infinite'
            }}
          />
          <div
            className="pointer-events-none absolute right-[-200px] top-[40%] h-[500px] w-[500px] rounded-full opacity-[0.1] blur-[120px]"
            style={{ background: 'radial-gradient(circle, #06b6d4, transparent)' }}
          />
          <div
            className="pointer-events-none absolute left-[-150px] top-[60%] h-[400px] w-[400px] rounded-full opacity-[0.08] blur-[100px]"
            style={{ background: 'radial-gradient(circle, #a855f7, transparent)' }}
          />
        </>
      );
    }

    // ── Main App ──────────────────────────────────────────────────────
    function App() {
      const [sessionStatus, setSessionStatus] = useState(null);

      useEffect(() => {
        fetch('/api/session-status')
          .then(r => r.json())
          .then(data => {
            setSessionStatus(data);
            if (data.configured) {
              // Already has credentials, redirect to dashboard after a short pause
              setTimeout(() => { window.location.href = '/dashboard'; }, 300);
            }
          })
          .catch(() => setSessionStatus({ configured: false }));
      }, []);

      return (
        <div className="relative isolate min-h-screen w-full overflow-hidden" style={{ background: '#080810' }}>
          <OrbBg />

          {/* ── Navbar ── */}
          <header className="relative z-30 w-full px-6 py-5 flex items-center justify-between max-w-7xl mx-auto">
            <div className="flex items-center gap-3">
              <img
                src="/static/images/logo-dark.svg"
                alt="KLyck"
                className="h-10 md:h-12 w-auto object-contain"
                onError={e => e.target.style.display = 'none'}
              />
            </div>
            <div className="flex items-center gap-3">
              <a
                href="#features"
                className="hidden sm:block text-sm font-medium text-gray-400 hover:text-white transition px-3 py-1.5"
              >
                Features
              </a>
              <a
                href="#connect"
                className="inline-flex items-center gap-2 text-sm font-semibold px-4 py-2 rounded-xl bg-white/[0.06] border border-white/[0.1] text-white hover:bg-white/[0.1] transition"
              >
                Connect Account
              </a>
            </div>
          </header>

          {/* ── Hero Section ── */}
          <main className="relative z-10 px-5 pt-10 pb-20 text-center max-w-5xl mx-auto">

            {/* Badge */}
            <div className="animate-rise inline-flex items-center gap-2 bg-indigo-500/15 border border-indigo-500/30 rounded-full px-4 py-1.5 text-sm font-semibold text-indigo-300 mb-8">
              <span className="w-2 h-2 rounded-full bg-indigo-400 inline-block" style={{ animation: 'pulse-ring 2s ease-out infinite' }}></span>
              Naukri Job Automation — 100% Local
            </div>

            {/* Headline */}
            <h1
              className="animate-rise-2 font-black leading-[0.95] tracking-tight text-white mb-6"
              style={{ fontSize: 'clamp(44px, 7vw, 88px)', letterSpacing: '-3px' }}
            >
              Your job search,<br />
              <span className="relative inline-block">
                on autopilot.
                <svg
                  viewBox="0 0 540 22"
                  preserveAspectRatio="none"
                  className="absolute left-[-1%] w-[102%] overflow-visible"
                  style={{ bottom: '-16px', height: '22px' }}
                >
                  <defs>
                    <linearGradient id="ug" x1="0" x2="1">
                      <stop stopColor="#818cf8" />
                      <stop offset=".5" stopColor="#6366f1" />
                      <stop offset="1" stopColor="#4f46e5" />
                    </linearGradient>
                  </defs>
                  <path
                    pathLength="1"
                    d="M6 14C120 4 300 3 534 12"
                    className="animate-underline"
                    style={{
                      fill: 'none',
                      stroke: 'url(#ug)',
                      strokeWidth: '5',
                      strokeLinecap: 'round',
                      strokeDasharray: '1',
                      strokeDashoffset: '1'
                    }}
                  />
                </svg>
              </span>
            </h1>

            {/* Subtitle */}
            <p className="animate-rise-3 text-[18px] leading-[1.6] text-gray-500 max-w-[680px] mx-auto mt-10 mb-10">
              KLyck automates your Naukri profile boost, job applications, and resume sync.
              Connect your account once and let the AI handle the rest — privately, locally, with live analytics.
            </p>

            {/* CTA Buttons */}
            <div className="animate-rise-4 flex flex-col sm:flex-row gap-4 justify-center mb-16">
              <a
                href="#connect"
                className="relative group overflow-hidden inline-flex h-14 items-center justify-center gap-2.5 rounded-xl bg-gradient-to-b from-indigo-500 to-indigo-700 px-8 text-[16px] font-bold text-white shadow-[0_0_0_1px_rgba(99,102,241,0.6),0_16px_40px_-12px_rgba(99,102,241,0.85)] hover:shadow-[0_0_0_1px_rgba(99,102,241,0.8),0_20px_50px_-10px_rgba(99,102,241,0.9)] transition-all"
              >
                <span className="animate-sweep absolute inset-y-0 -left-[60%] w-[40%] skew-x-[-20deg] bg-gradient-to-r from-transparent via-white/40 to-transparent pointer-events-none" />
                <span>Get Started Free</span>
                <svg className="w-4 h-4 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 12h14M13 6l6 6-6 6" />
                </svg>
              </a>
              <a
                href="#features"
                className="inline-flex h-14 items-center justify-center gap-2.5 rounded-xl border border-white/[0.12] bg-white/[0.04] px-8 text-[16px] font-bold text-white hover:bg-white/[0.08] transition"
              >
                <svg className="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M7 4.5v15l13-7.5z" />
                </svg>
                See Features
              </a>
            </div>

            {/* Stats Row */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-20 animate-rise-4">
              {STATS.map((s, i) => (
                <div key={i} className="rounded-2xl p-5 text-center" style={{ background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.06)' }}>
                  <div className="text-3xl font-black text-white mb-1">{s.value}</div>
                  <div className="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-1">{s.label}</div>
                  <div className="text-xs text-gray-600">{s.sub}</div>
                </div>
              ))}
            </div>
          </main>

          {/* ── Features Section ── */}
          <section id="features" className="relative z-10 px-5 py-16 max-w-6xl mx-auto">
            <div className="text-center mb-14">
              <h2 className="text-[clamp(28px,4vw,46px)] font-black text-white tracking-tight mb-4">
                Everything you need to<br />
                <span className="text-indigo-400">land your next role faster</span>
              </h2>
              <p className="text-gray-500 text-lg max-w-[560px] mx-auto">
                Powerful browser automation with zero cloud dependency. All your data stays on your machine.
              </p>
            </div>

            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {FEATURES.map((f, i) => (
                <FeatureCard key={i} {...f} delay={`${i * 60}ms`} />
              ))}
            </div>
          </section>

          {/* ── Connect Section ── */}
          <section id="connect" className="relative z-10 px-5 py-20 max-w-lg mx-auto">
            {/* Glow behind card */}
            <div
              className="absolute inset-0 rounded-3xl opacity-30 blur-3xl pointer-events-none"
              style={{ background: 'radial-gradient(ellipse, rgba(99,102,241,0.4), transparent 70%)' }}
            />

            <div className="relative rounded-3xl p-8 sm:p-10" style={{ background: 'rgba(14,12,24,0.9)', border: '1px solid rgba(99,102,241,0.2)', backdropFilter: 'blur(24px)' }}>
              {/* Icon */}
              <div className="flex items-center justify-center mb-6">
                <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500/30 to-purple-500/20 flex items-center justify-center border border-indigo-500/20">
                  <svg className="w-7 h-7 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                  </svg>
                </div>
              </div>

              <h2 className="text-2xl font-black text-white text-center mb-2">
                Connect Your Naukri Account
              </h2>
              <p className="text-gray-500 text-center text-sm mb-8 leading-relaxed">
                Enter your credentials to unlock the full automation dashboard. Stored 100% locally.
              </p>

              {sessionStatus === null ? (
                <div className="flex justify-center py-8">
                  <svg className="w-6 h-6 animate-spin text-indigo-500" fill="none" viewBox="0 0 24 24">
                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
                  </svg>
                </div>
              ) : (
                <LoginForm />
              )}

              {/* Divider */}
              <div className="mt-8 pt-6 border-t border-white/5 flex items-center justify-center gap-6 text-xs text-gray-600">
                <span className="flex items-center gap-1.5">
                  <svg className="w-3.5 h-3.5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                  </svg>
                  Locally stored only
                </span>
                <span className="flex items-center gap-1.5">
                  <svg className="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                  No cloud, no tracking
                </span>
                <span className="flex items-center gap-1.5">
                  <svg className="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                  </svg>
                  Open source
                </span>
              </div>
            </div>
          </section>

          {/* ── Footer ── */}
          <footer className="relative z-10 px-6 py-10 border-t border-white/[0.05] text-center">
            <div className="flex items-center justify-center mb-4">
              <img
                src="/static/images/logo-dark.svg"
                alt="KLyck"
                className="h-8 w-auto object-contain opacity-60"
                onError={e => e.target.style.display = 'none'}
              />
            </div>
            <p className="text-gray-600 text-sm">
              KLyck — Smart Naukri Automation &bull; Built with ❤️ for job seekers &bull; 100% Private &bull; Open Source
            </p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
